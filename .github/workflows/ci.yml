name: Native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: npm run lint

  prestashop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['prestashop/prestashop:8', 'prestashop/prestashop:9']
    steps:
      - uses: actions/checkout@v7
      - name: Native install lifecycle
        env:
          PRESTASHOP_IMAGE: ${{ matrix.image }}
        run: npm run test:native
