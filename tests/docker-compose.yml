services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: native-test-root
      MARIADB_DATABASE: prestashop
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  prestashop:
    image: ${PRESTASHOP_IMAGE:-prestashop/prestashop:9}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8087:80"
    environment:
      DB_SERVER: database
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: native-test-root
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:8087
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-dev
      PS_DEMO_MODE: 0
      ADMIN_MAIL: native@example.test
      ADMIN_PASSWD: Native-Test-2026!
    volumes:
      - ..:/var/www/html/modules/govpexchange

